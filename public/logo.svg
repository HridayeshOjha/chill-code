<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200">
  <defs>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#3B5BFF"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#246BFF"/>
      <stop offset="100%" stop-color="#10CFE0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="#FFFFFF"/>

  <!-- Code mark -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#softShadow)">
    <!-- Left chevron -->
    <path d="M 440 390 L 300 500 L 440 610"
          stroke="url(#leftGrad)" stroke-width="54"/>

    <!-- Right chevron -->
    <path d="M 760 390 L 900 500 L 760 610"
          stroke="url(#rightGrad)" stroke-width="54"/>

    <!-- Tilted slash -->
    <path d="M 690 300 L 555 700"
          stroke="#14213D" stroke-width="58"/>

    <!-- Horizontal slash -->
    <path d="M 405 500 L 795 500"
          stroke="#14213D" stroke-width="58"/>
  </g>

  <!-- Wordmark -->
  <text x="600" y="815"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="76"
        font-weight="500"
        letter-spacing="24"
        fill="#14213D">CHILL CODE</text>

  <!-- Tagline -->
  <text x="600" y="875"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        font-weight="500"
        letter-spacing="10"
        fill="#71809A">BUILD. CHILL. REPEAT.</text>
</svg>